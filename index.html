<title>WorkSuite – Tasks, Repayments & Notes</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f0f0f2;
  --border: #d2d2d7;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-light: #e8f0fd;
  --positive-light: #eafaf0;
  --moratorium-light: #fff8ec;
  --moratorium-border: #ff9f0a;
  --input-bg: #fafafa;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow: 0 2px 8px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.06);
  --shadow-md: 0 4px 24px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.06);
  --nav-bg: rgba(255,255,255,.88);
  --thead-bg: #f5f5f7;
  --overdue: #ef4444; --today: #f97316; --two-days: #eab308;
  --seven-days: #22c55e; --beyond: #3b82f6; --done: #9ca3af;
  --nav-height: 100px;
}

body.dark {
  --bg: #0a0a0a;
  --surface: #1c1c1e;
  --surface2: #28282a;
  --border: #3a3a3c;
  --text-primary: #f5f5f7;
  --text-secondary: #aeaeb2;
  --text-tertiary: #636366;
  --accent: #4da3ff;
  --accent-hover: #6eb5ff;
  --accent-light: #1a2f50;
  --positive-light: #0d2b18;
  --moratorium-light: #2b2200;
  --moratorium-border: #c97800;
  --input-bg: #2c2c2e;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
  --shadow-md: 0 4px 24px rgba(0,0,0,.5);
  --nav-bg: rgba(28,28,30,.92);
  --thead-bg: #2c2c2e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── SHARED NAV ── */
nav.main-nav {
  position: sticky; top: 0; z-index: 200;
  background: var(--nav-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 0 32px;
  transition: background .25s ease;
}
.nav-row1 { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 16px; }
.nav-row2 { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: 8px; flex-wrap: wrap; }
.nav-logo { font-size: 17px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
.nav-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 24px; padding: 3px; }
.nav-tab {
  font-size: 13px; font-weight: 500; border: none; cursor: pointer;
  padding: 6px 18px; border-radius: 20px; background: transparent;
  color: var(--text-secondary); transition: all .18s ease;
}
.nav-tab:hover { color: var(--text-primary); }
.nav-tab.active { background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow); }
.nav-actions { display: flex; align-items: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; border-radius: 20px;
  padding: 6px 14px; cursor: pointer; border: none;
  transition: all .18s ease;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--accent-light); }
.btn-theme {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; border-radius: 20px;
  padding: 6px 14px; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-primary);
  transition: all .2s ease; white-space: nowrap;
}
.btn-theme:hover { background: var(--bg); }

/* ── PENDENCY TRACKER SECTION ── */
#pendency-section { min-height: calc(100vh - var(--nav-height)); }

/* Setup Wizard */
.pt-setup-wrap { display: flex; align-items: center; justify-content: center; padding: 40px 24px; min-height: calc(100vh - var(--nav-height)); }
.pt-wizard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; max-width: 660px; width: 100%; box-shadow: var(--shadow-md); }
.wizard-header { text-align: center; margin-bottom: 28px; }
.wizard-header .icon { font-size: 3rem; margin-bottom: 10px; }
.wizard-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.wizard-header p { color: var(--text-secondary); font-size: 0.88rem; margin-top: 6px; }
.pt-steps { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
.pt-step { background: var(--surface2); border-radius: var(--radius-md); padding: 16px 20px; border: 1px solid var(--border); }
.pt-step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: white; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; float: left; margin-right: 12px; flex-shrink: 0; margin-top: 2px; }
.pt-step-body { overflow: hidden; }
.pt-step-body h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
.pt-step-body p { font-size: 0.81rem; color: var(--text-secondary); line-height: 1.6; }
.pt-step-body a { color: var(--accent); text-decoration: none; }
.pt-step-body a:hover { text-decoration: underline; }
.pt-step-body code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.78rem; color: #0071e3; }
body.dark .pt-step-body code { color: #60c0ff; }
.config-area { width: 100%; background: var(--bg); border: 1.5px solid var(--border); color: var(--text-primary); padding: 12px; border-radius: var(--radius-sm); font-family: 'Courier New', monospace; font-size: 0.78rem; min-height: 120px; resize: vertical; transition: border-color .2s; margin-top: 10px; }
.config-area:focus { outline: none; border-color: var(--accent); }
.config-area::placeholder { color: var(--text-tertiary); }
.btn-save-config { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all .2s; }
.btn-save-config:hover { background: var(--accent-hover); }
.config-error { color: #ef4444; font-size: 0.78rem; margin-top: 6px; display: none; }

/* Login */
.pt-login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--nav-height)); padding: 24px; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px 40px; max-width: 420px; width: 100%; text-align: center; box-shadow: var(--shadow-md); }
.login-card .app-icon { font-size: 3.5rem; margin-bottom: 14px; }
.login-card h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
.login-card p { color: var(--text-secondary); font-size: 0.86rem; margin-bottom: 28px; line-height: 1.6; }
.btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 13px 20px; background: white; color: #1f1f1f; border: none; border-radius: var(--radius-sm); font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.btn-google:hover { background: #f5f5f7; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
.login-note { color: var(--text-tertiary); font-size: 0.73rem; margin-top: 18px; }
.btn-reset-config { background: none; border: none; color: var(--text-tertiary); font-size: 0.73rem; cursor: pointer; margin-top: 10px; text-decoration: underline; }

/* Summary Cards */
.pt-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding: 24px 32px 0; }
.pt-summary-card { background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; border-left: 4px solid; cursor: pointer; transition: all .2s; box-shadow: var(--shadow); }
.pt-summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.card-today { border-color: #f97316; } .card-today .count { color: #f97316; }
.card-two { border-color: #eab308; } .card-two .count { color: #eab308; }
.card-seven { border-color: #22c55e; } .card-seven .count { color: #22c55e; }
.card-beyond { border-color: var(--accent); } .card-beyond .count { color: var(--accent); }
.card-done { border-color: #9ca3af; } .card-done .count { color: #9ca3af; }
.card-trash { border-color: #6b7280; } .card-trash .count { color: #9ca3af; }

/* Toolbar */
.pt-toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 32px; flex-wrap: wrap; }
.pt-search-wrap { position: relative; flex: 1; min-width: 160px; }
.pt-search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }
.pt-search-box { width: 100%; background: var(--surface); border: 1.5px solid var(--border); color: var(--text-primary); padding: 9px 12px 9px 34px; border-radius: var(--radius-sm); font-size: 0.86rem; font-family: inherit; transition: border-color .2s; }
.pt-search-box:focus { outline: none; border-color: var(--accent); }

.pt-filter-btn:hover { color: var(--text-primary); border-color: var(--accent); }
.pt-filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.pt-filter-btn.p-urgent.active { background: rgba(239,68,68,.1); color: #ef4444; border-color: rgba(239,68,68,.4); }
.pt-filter-btn.p-moderate.active { background: rgba(249,115,22,.1); color: #f97316; border-color: rgba(249,115,22,.4); }
.pt-filter-btn.p-low.active { background: rgba(34,197,94,.1); color: #22c55e; border-color: rgba(34,197,94,.4); }
.tab-allotted-btn { background: var(--surface); color: var(--text-secondary); border: 1.5px solid var(--border); padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; transition: all .2s; white-space: nowrap; font-weight: 600; font-family: inherit; }
.tab-allotted-btn:hover { color: #a855f7; border-color: rgba(168,85,247,.4); }

/* Employee Panel */
.emp-panel { padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); background: rgba(168,85,247,.03); }

.emp-chip { background: var(--surface); border: 1.5px solid var(--border); border-radius: 99px; padding: 5px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
.emp-chip:hover { border-color: rgba(168,85,247,.5); color: #a855f7; }
.emp-chip.active { background: rgba(168,85,247,.1); border-color: rgba(168,85,247,.5); color: #a855f7; }
.emp-chip .ecount { font-size: 0.65rem; background: var(--surface2); border-radius: 99px; padding: 1px 6px; color: var(--text-secondary); }
.emp-chip.active .ecount { background: rgba(168,85,247,.15); color: #a855f7; }

/* Content / Sections */
.pt-content { padding: 0 32px 60px; display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.pt-section-header { display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; margin-bottom: 6px; border-bottom: 1.5px solid var(--border); cursor: pointer; user-select: none; flex-wrap: wrap; }

.s-overdue .section-dot { background: #ef4444; } .s-overdue h2 { color: #ef4444; }

/* Task Cards */
.pt-tasks { display: flex; flex-direction: column; gap: 8px; }
.task-card { background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); transition: all .2s; position: relative; overflow: hidden; box-shadow: var(--shadow); }

function loadNotes(uid) {
  if (unsubNotes) unsubNotes();
  unsubNotes = db.collection('users').doc(uid).collection('notes')
    .orderBy('created', 'asc')
    .onSnapshot(snap => {
      // Rebuild notesTopics while preserving local collapsed state
      const prevCollapsed = {};
      notesTopics.forEach(t => { prevCollapsed[t.id] = t.collapsed; });
      notesTopics = snap.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          title: data.title || '',
          color: data.color || NT_COLORS[5],
          deleted: data.deleted || false,
          subtopics: (data.subtopics || []).map(s => ({
            id: s.id || ntUid(),
            title: s.title || '',
            desc: s.desc || '',
            body: s.body || '',
            deleted: s.deleted || false
          })),
          collapsed: prevCollapsed[d.id] !== undefined ? prevCollapsed[d.id] : false
        };
      });
      renderNotes();
    }, err => console.warn('Notes sync error:', err));
}

function ntUid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

  if (!auth?.currentUser) return;
  const uid = auth.currentUser.uid;
  const col = db.collection('users').doc(uid).collection('notes');
  if (topicId) {
    await col.doc(topicId).update({ title, color });
  } else {
    await col.add({ title, color, subtopics: [], created: firebase.firestore.FieldValue.serverTimestamp() });
  }
}

async function ntTrashTopic(topicId) {
  if (!auth?.currentUser) return;
  const uid = auth.currentUser.uid;
  await db.collection('users').doc(uid).collection('notes').doc(topicId).update({ deleted: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() });
}

async function ntRestoreTopic(topicId) {
  if (!auth?.currentUser) return;
  const uid = auth.currentUser.uid;
  await db.collection('users').doc(uid).collection('notes').doc(topicId).update({ deleted: false, deletedAt: null });
}

async function ntPermanentDeleteTopic(topicId) {
  if (!auth?.currentUser) return;
  const uid = auth.currentUser.uid;
  await db.collection('users').doc(uid).collection('notes').doc(topicId).delete();
}

async function ntSaveSubtopics(topicId, subtopics) {
  if (!auth?.currentUser) return;
  const uid = auth.currentUser.uid;
  await db.collection('users').doc(uid).collection('notes').doc(topicId).update({ subtopics });
}

// ── Topic Modal ────────────────────────────────────────────────────

function openTopicModal(topicId) {
  ntEditTopicId = topicId || null;
  const existing = topicId ? notesTopics.find(t => t.id === topicId) : null;
  document.getElementById('topicModalTitle').textContent = topicId ? 'Edit Topic' : 'Add Main Topic';
  document.getElementById('ntTopicTitle').value = existing ? existing.title : '';
  ntSelectedColor = existing ? existing.color : NT_COLORS[5];
  buildColorPicker();
  document.getElementById('topicModalBackdrop').classList.add('show');
  setTimeout(() => document.getElementById('ntTopicTitle').focus(), 80);
}

function buildColorPicker() {
  const wrap = document.getElementById('ntColorPicker');
  wrap.innerHTML = '';
  NT_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'nt-color-swatch' + (c === ntSelectedColor ? ' selected' : '');
    sw.style.background = c;
    sw.title = c;
    sw.onclick = () => { ntSelectedColor = c; buildColorPicker(); };
    wrap.appendChild(sw);
  });
}

function closeTopicModal() { document.getElementById('topicModalBackdrop').classList.remove('show'); }
function closeTopicModalOnBackdrop(e) { if (e.target === e.currentTarget) closeTopicModal(); }

async function saveTopic() {
  const title = document.getElementById('ntTopicTitle').value.trim();
  if (!title) { document.getElementById('ntTopicTitle').focus(); return; }
  closeTopicModal();
  try {
    await ntSaveTopic(ntEditTopicId, title, ntSelectedColor);
    showToast(ntEditTopicId ? 'Topic updated ✓' : 'Topic added ✓');
  } catch(e) { showToast('Error saving topic: ' + e.message, '#ef4444'); }
}

// ── Subtopic Modal ─────────────────────────────────────────────────

function openSubtopicModal(topicId, subtopicId) {
  ntEditSubtopicTopicId = topicId;
  ntEditSubtopicId = subtopicId || null;
  const topic = notesTopics.find(t => t.id === topicId);
  const existing = subtopicId ? topic?.subtopics.find(s => s.id === subtopicId) : null;
  document.getElementById('subtopicModalTitle').textContent = subtopicId ? 'Edit Subtopic' : 'Add Subtopic';
  document.getElementById('ntSubTitle').value = existing ? existing.title : '';
  document.getElementById('ntSubDesc').value = existing ? (existing.desc || '') : '';
  document.getElementById('ntSubBody').value = existing ? (existing.body || '') : '';
  document.getElementById('subtopicModalBackdrop').classList.add('show');
  setTimeout(() => document.getElementById('ntSubTitle').focus(), 80);
}

function closeSubtopicModal() { document.getElementById('subtopicModalBackdrop').classList.remove('show'); }
function closeSubtopicModalOnBackdrop(e) { if (e.target === e.currentTarget) closeSubtopicModal(); }

async function saveSubtopic() {
  const title = document.getElementById('ntSubTitle').value.trim();
  const desc = document.getElementById('ntSubDesc').value.trim();
  const body = document.getElementById('ntSubBody').value.trim();
  if (!title) { document.getElementById('ntSubTitle').focus(); return; }
  const topic = notesTopics.find(t => t.id === ntEditSubtopicTopicId);
  if (!topic) return;
  closeSubtopicModal();
  let updatedSubs;
  if (ntEditSubtopicId) {
    updatedSubs = topic.subtopics.map(s => s.id === ntEditSubtopicId ? { ...s, title, desc, body } : s);
  } else {
    updatedSubs = [...topic.subtopics, { id: ntUid(), title, desc, body }];
  }
  try {
    await ntSaveSubtopics(ntEditSubtopicTopicId, updatedSubs);
    showToast(ntEditSubtopicId ? 'Subtopic updated ✓' : 'Subtopic added ✓');
  } catch(e) { showToast('Error saving subtopic: ' + e.message, '#ef4444'); }
}

// ── Confirm Delete Modal ───────────────────────────────────────────

function openNtConfirm(title, msg, callback) {
  document.getElementById('ntConfirmTitle').textContent = title;
  document.getElementById('ntConfirmMsg').textContent = msg;
  ntConfirmCallback = callback;
  document.getElementById('ntConfirmBackdrop').classList.add('show');
}
function closeNtConfirmModal() {
  document.getElementById('ntConfirmBackdrop').classList.remove('show');
  ntConfirmCallback = null;
}
function closeNtConfirm(e) { if (e.target === e.currentTarget) closeNtConfirmModal(); }
function ntConfirmAction() {
  if (ntConfirmCallback) ntConfirmCallback();
  closeNtConfirmModal();
}

function confirmDeleteTopic(topicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  if (!topic) return;
  openNtConfirm(
    'Move to Trash?',
    `"${topic.title}" and its ${topic.subtopics.filter(s=>!s.deleted).length} subtopic(s) will be moved to Trash. You can restore them later.`,
    async () => {
      try { await ntTrashTopic(topicId); showToast('Moved to Trash 🗑️'); }
      catch(e) { showToast('Error: ' + e.message, '#ef4444'); }
    }
  );
}

function confirmDeleteSubtopic(topicId, subtopicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  const sub = topic?.subtopics.find(s => s.id === subtopicId);
  if (!sub) return;
  openNtConfirm(
    'Move to Trash?',
    `"${sub.title}" will be moved to Trash. You can restore it later.`,
    async () => {
      const updatedSubs = topic.subtopics.map(s => s.id === subtopicId ? { ...s, deleted: true } : s);
      try { await ntSaveSubtopics(topicId, updatedSubs); showToast('Moved to Trash 🗑️'); }
      catch(e) { showToast('Error: ' + e.message, '#ef4444'); }
    }
  );
}

function confirmPermanentDeleteTopic(topicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  if (!topic) return;
  openNtConfirm(
    'Permanently Delete?',
    `"${topic.title}" will be permanently deleted and cannot be recovered.`,
    async () => {
      try { await ntPermanentDeleteTopic(topicId); showToast('Permanently deleted'); }
      catch(e) { showToast('Error: ' + e.message, '#ef4444'); }
    }
  );
}

function confirmPermanentDeleteSubtopic(topicId, subtopicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  const sub = topic?.subtopics.find(s => s.id === subtopicId);
  if (!sub) return;
  openNtConfirm(
    'Permanently Delete?',
    `"${sub.title}" will be permanently deleted and cannot be recovered.`,
    async () => {
      const updatedSubs = topic.subtopics.filter(s => s.id !== subtopicId);
      try { await ntSaveSubtopics(topicId, updatedSubs); showToast('Permanently deleted'); }
      catch(e) { showToast('Error: ' + e.message, '#ef4444'); }
    }
  );
}

async function ntRestoreSubtopic(topicId, subtopicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  if (!topic) return;
  const updatedSubs = topic.subtopics.map(s => s.id === subtopicId ? { ...s, deleted: false } : s);
  try { await ntSaveSubtopics(topicId, updatedSubs); showToast('Subtopic restored ✓'); }
  catch(e) { showToast('Error: ' + e.message, '#ef4444'); }
}

// ── Collapse toggle ────────────────────────────────────────────────

function toggleTopicCollapse(topicId) {
  const topic = notesTopics.find(t => t.id === topicId);
  if (!topic) return;
  topic.collapsed = !topic.collapsed;
  renderNotes();
}

// ── Render ─────────────────────────────────────────────────────────

function renderNotes() {
  const query = (document.getElementById('notesSearchInput')?.value || '').toLowerCase().trim();
  const container = document.getElementById('notesContent');
  const emptyState = document.getElementById('notesEmptyState');
  if (!container) return;

  // Split active vs trashed topics
  const activeTopics = notesTopics.filter(t => !t.deleted);
  const trashedTopics = notesTopics.filter(t => t.deleted);

  // Filter active topics by search query
  let filtered = activeTopics.map(topic => {
    const activeSubs = topic.subtopics.filter(s => !s.deleted);
    if (!query) return { ...topic, _filteredSubs: activeSubs };
    const titleMatch = topic.title.toLowerCase().includes(query);
    const filteredSubs = activeSubs.filter(s =>
      s.title.toLowerCase().includes(query) || s.body.toLowerCase().includes(query)
    );
    if (!titleMatch && filteredSubs.length === 0) return null;
    return { ...topic, _filteredSubs: titleMatch ? activeSubs : filteredSubs };
  }).filter(Boolean);

  // Show/hide empty state
  emptyState.style.display = filtered.length === 0 && !query ? 'flex' : 'none';
  emptyState.style.flexDirection = 'column';
  emptyState.style.alignItems = 'center';

  // Clear old cards and trash section
  container.querySelectorAll('.nt-topic-card, .nt-trash-section').forEach(el => el.remove());

  // Render active topic cards
  filtered.forEach(topic => {
    const isCollapsed = topic.collapsed && !query;
    const card = document.createElement('div');
    card.className = 'nt-topic-card';
    card.dataset.topicId = topic.id;
    const subCount = topic._filteredSubs.length;
    card.innerHTML = `
      <div class="nt-topic-header" onclick="toggleTopicCollapse('${topic.id}')">
        <div class="nt-topic-color-bar" style="background:${topic.color};"></div>
        <span class="nt-topic-name">${escapeHtml(topic.title)}</span>
        <span class="nt-topic-count">${subCount} subtopic${subCount !== 1 ? 's' : ''}</span>
        <div class="nt-topic-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" title="Edit topic" onclick="openTopicModal('${topic.id}')">✏️</button>
          <button class="icon-btn del" title="Move to trash" onclick="confirmDeleteTopic('${topic.id}')">🗑️</button>
        </div>
        <span class="nt-topic-toggle${isCollapsed ? ' collapsed' : ''}">▾</span>
      </div>
      <div class="nt-subtopics${isCollapsed ? ' nt-collapsed' : ''}">
        ${topic._filteredSubs.map(s => `
          <div class="nt-subtopic-row" data-sub-id="${s.id}">
            <div class="nt-sub-header">
              <div style="flex:1;min-width:0;">
                <span class="nt-sub-title">${escapeHtml(s.title)}</span>
                ${s.desc ? `<div class="nt-sub-desc">${escapeHtml(s.desc)}</div>` : ''}
              </div>
              <div class="nt-sub-actions">
                <button class="icon-btn" title="Edit subtopic" onclick="openSubtopicModal('${topic.id}','${s.id}')">✏️</button>
                <button class="icon-btn del" title="Move to trash" onclick="confirmDeleteSubtopic('${topic.id}','${s.id}')">🗑️</button>
              </div>
            </div>
            ${s.body ? `
            <div class="nt-copy-btn-wrap">
              <button class="nt-copy-btn" onclick="copyNoteBody(this, '${s.id}')" aria-label="Copy note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span class="nt-copy-tooltip">Copy</span>
              </button>
              <div class="nt-sub-body">${escapeHtml(s.body)}</div>
            </div>` : ''}
          </div>
        `).join('')}
        <div class="nt-add-sub-row">
          <button class="nt-add-sub-btn" onclick="openSubtopicModal('${topic.id}')">＋ Add Subtopic</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // ── Trash section ──────────────────────────────────────────────
  // Collect all trashed items: trashed topics + trashed subtopics within active topics
  const trashedSubs = [];
  activeTopics.forEach(topic => {
    topic.subtopics.filter(s => s.deleted).forEach(s => {
      trashedSubs.push({ topicId: topic.id, topicTitle: topic.title, topicColor: topic.color, sub: s });
    });
  });

  const totalTrashed = trashedTopics.length + trashedSubs.length;
  if (totalTrashed === 0 || query) return; // hide trash section during search

  const trashSection = document.createElement('div');
  trashSection.className = 'nt-trash-section';
  trashSection.innerHTML = `
    <div class="nt-trash-header" onclick="this.parentElement.classList.toggle('nt-trash-open')">
      <span>🗑️ Trash</span>
      <span class="nt-topic-count">${totalTrashed} item${totalTrashed !== 1 ? 's' : ''}</span>
      <span class="nt-topic-toggle" style="margin-left:auto;">▾</span>
    </div>
    <div class="nt-trash-body">
      ${trashedTopics.map(t => `
        <div class="nt-trash-row">
          <div class="nt-topic-color-bar" style="background:${t.color};height:28px;"></div>
          <div class="nt-trash-info">
            <span class="nt-trash-label">📁 Topic</span>
            <span class="nt-trash-title">${escapeHtml(t.title)}</span>
            <span class="nt-trash-sub-count">${t.subtopics.filter(s=>!s.deleted).length} subtopic(s)</span>
          </div>
          <div class="nt-sub-actions">
            <button class="icon-btn restore" title="Restore" onclick="ntRestoreTopic('${t.id}')">↩️</button>
            <button class="icon-btn del" title="Delete permanently" onclick="confirmPermanentDeleteTopic('${t.id}')">✕</button>
          </div>
        </div>
      `).join('')}
      ${trashedSubs.map(({ topicId, topicTitle, topicColor, sub }) => `
        <div class="nt-trash-row">
          <div class="nt-topic-color-bar" style="background:${topicColor};height:28px;"></div>
          <div class="nt-trash-info">
            <span class="nt-trash-label">📄 Subtopic of <em>${escapeHtml(topicTitle)}</em></span>
            <span class="nt-trash-title">${escapeHtml(sub.title)}</span>
          </div>
          <div class="nt-sub-actions">
            <button class="icon-btn restore" title="Restore" onclick="ntRestoreSubtopic('${topicId}','${sub.id}')">↩️</button>
            <button class="icon-btn del" title="Delete permanently" onclick="confirmPermanentDeleteSubtopic('${topicId}','${sub.id}')">✕</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  container.appendChild(trashSection);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Keyboard shortcuts for Notes modals
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    if (document.getElementById('topicModalBackdrop').classList.contains('show')) {
      e.preventDefault(); saveTopic();
    }
  }
  if (e.key === 'Escape') {
    if (document.getElementById('topicModalBackdrop').classList.contains('show')) closeTopicModal();
    if (document.getElementById('subtopicModalBackdrop').classList.contains('show')) closeSubtopicModal();
    if (document.getElementById('ntConfirmBackdrop').classList.contains('show')) closeNtConfirmModal();
  }
});

// Copy note body text to clipboard
function copyNoteBody(btn, subId) {
  const wrap = btn.closest('.nt-copy-btn-wrap');
  const bodyEl = wrap ? wrap.querySelector('.nt-sub-body') : null;
  if (!bodyEl) return;
  const text = bodyEl.innerText || bodyEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const tooltip = btn.querySelector('.nt-copy-tooltip');
    if (tooltip) {
      tooltip.textContent = 'Copied!';
      btn.style.background = 'var(--positive-light)';
      setTimeout(() => {
        tooltip.textContent = 'Copy';
        btn.style.background = '';
      }, 1500);
    }
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}
